[package]
name = "emma_plugin_template"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "An EMMA plugin: replace this with what your plugin does."

[lib]
# A Wasm component is built from a cdylib.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
